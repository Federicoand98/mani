name: Docs

# The site publishes on a merge to master, not on a tag: a typo in the docs
# should not wait for the next release. Only docs changes trigger it.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "_examples/**" # the site includes these manifests at build time
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a cancelled deploy leaves
# the site in whatever state it reached.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # enableGitInfo needs the history for "last modified"

      # Hextra is a Hugo module, and Hugo modules are fetched with the Go tool.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Hugo extended
        run: |
          curl -sSLo hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        working-directory: docs
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
