name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Si rilascia SOLO la punta di master. Il controllo precedente usava
      # `merge-base --is-ancestor`, che verifica soltanto che il commit stia da
      # qualche parte nella storia di master: v0.1.0 venne taggata sul commit
      # iniziale (solo .gitignore e LICENSE) e passo' senza un fiato.
      #
      # Nota: `--depth=0` non esiste, git vuole un intero positivo. "Tutta la
      # storia" si ottiene omettendo il flag; il refspec esplicito garantisce
      # che refs/remotes/origin/master esista davvero.
      - name: Refuse to release a tag that is not the tip of master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          tip="$(git rev-parse refs/remotes/origin/master)"
          if [ "$GITHUB_SHA" != "$tip" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not the tip of master (${tip}); refusing to release"
            exit 1
          fi

      - name: Select goreleaser mode
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "flags=--snapshot" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go test -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
