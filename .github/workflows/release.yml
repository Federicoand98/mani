name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to release a tag that is not on master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=0 origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag ${GITHUB_REF_NAME} points at a commit that is not on master; refusing to release"
            exit 1
          fi

      - name: Select goreleaser mode
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "flags=--snapshot" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go test -count=1 ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
