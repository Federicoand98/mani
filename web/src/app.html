<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<title>mani</title>
		<script>
			// Apply the saved theme before the first paint, so a dark choice never flashes light.
			try {
				var t = localStorage.getItem('mani:theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				if (localStorage.getItem('mani:reduce-motion') === '1') document.documentElement.classList.add('reduce');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
