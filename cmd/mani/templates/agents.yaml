# agent.yaml — generated by `mani init`
#
# A manifest has eight blocks, each answering exactly one question.
# Only `identity` is required; delete anything you don't need.

identity:                    # who thinks?
  name: my-agent
  description: A helpful assistant
  provider: ollama           # ollama | openai | anthropic | copilot | openrouter
  model: qwen3.5:9b
  prompt: |
    You are a helpful assistant. Be concise.

capabilities:                # what can it do?
  workspace: .
  tools:
    - name: read
    - name: write

# context:                   # what does it see and remember?
#   window: 32000

# output:                    # what does it return?
#   schema:
#     type: object
#     properties:
#       answer: { type: string }

policy:                      # what is it allowed to do?
  tools:
    write: ask               # allow | ask | deny

limits:                      # how much may it consume?
  max_iterations: 20
  tool_timeout: 60s

# run:                       # when does it start, and how?
#   triggers:
#     - type: cron
#       every: 30m
#       prompt: check the inbox

observability:               # what does it leave behind?
  tracing: true
