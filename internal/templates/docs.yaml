# docs.yaml — generated by `mani init`
#
# A documents assistant: it reads and searches the files of its folder and
# answers with sources. Writing a file always asks you first.

identity:                    # who thinks?
  name: docs-assistant
  description: Answers questions about the documents in its folder, citing the files
  provider: ollama           # ollama | openai | anthropic | copilot | openrouter, or a custom endpoint
  model: qwen3.5:9b
  prompt: |
    Answer questions about the documents in your working folder.
    Search before you answer, and name the file each fact comes from.
    If the documents do not say, say so instead of guessing.

capabilities:                # what can it do?
  workspace: .               # file tools never reach outside this folder
  tools:
    - name: glob
    - name: grep
    - name: read
    - name: write

# context:                   # what does it see and remember?
#   window: 32000

policy:                      # what is it allowed to do?
  tools:
    glob: allow
    grep: allow
    read: allow
    write: ask               # writing waits for your yes

limits:                      # how much may it consume?
  max_tool_calls: 30
  max_duration: 3m

observability:               # what does it leave behind?
  journal:
    enabled: true
    path: runs
