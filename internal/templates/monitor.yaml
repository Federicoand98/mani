# monitor.yaml — generated by `mani init`
#
# A daily check: every morning it runs read-only commands and reports what is
# out of the ordinary. Nobody is there to answer a question at 07:00, so the
# tools are allowed and the rules below decide what a command may never do.

identity:                    # who thinks?
  name: daily-monitor
  description: Checks disk, memory and services every morning and reports what is wrong
  provider: ollama           # ollama | openai | anthropic | copilot | openrouter, or a custom endpoint
  model: qwen3.5:9b
  prompt: |
    Check free disk space, memory use and the services that should be running.
    Report only what is out of the ordinary, in a few lines. Never change anything.

capabilities:                # what can it do?
  workspace: .
  tools:
    - name: bash
    - name: read

policy:                      # what is it allowed to do?
  tools:
    bash: allow              # "ask" would mean "deny" here: the run starts alone
    read: allow
  rules:                     # checked on every call, before it runs
    - { tool: bash, pattern: 'rm\s', action: deny, label: "no deleting" }
    - { tool: bash, pattern: '^\s*sudo\b', action: deny, label: "no sudo" }
    - { tool: bash, pattern: '>', action: deny, label: "no writing through redirects" }

limits:                      # how much may it consume?
  max_tool_calls: 10
  max_duration: 2m
  tool_timeout: 30s

run:                         # when does it start, and how?
  triggers:
    - type: daily
      at: "07:00"
      prompt: Run the morning check.

observability:               # what does it leave behind?
  journal:
    enabled: true
    path: runs
