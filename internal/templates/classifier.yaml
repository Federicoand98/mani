# classifier.yaml — generated by `mani init`
#
# A classifier: one text in, one checked JSON answer out. No tools, so it can
# only label what it is given; a flow or a program reads the answer.

identity:                    # who thinks?
  name: classifier
  description: Labels the sentiment of a text and names the problem, if any
  provider: ollama           # ollama | openai | anthropic | copilot | openrouter, or a custom endpoint
  model: qwen3.5:9b
  prompt: |
    Classify the sentiment of the text given by the user.
    If it is negative, name the problem in a few words; otherwise leave the problem empty.

context:                     # what does it see and remember?
  inject: false              # no AGENTS.md: the text is all it needs

output:                      # what does it return?
  schema:
    type: object
    properties:
      sentiment: { type: string, enum: [positive, negative, neutral] }
      problem: { type: string }
    required: [sentiment, problem]

limits:                      # how much may it consume?
  max_iterations: 3
