# Counts and complaints in, a short note for the team out. Runs alone too:
#   mani run --config summarize.yaml --task '{"team": "Kitchen", "total": 2, "negative": [{"product": "Kettle", "problem": "lid broke", "reply_drafted": true}]}'

identity:
  name: review-summarizer
  description: "Writes a short note for the product team from the review tally"
  provider: ollama
  model: qwen3.6-35b-a3b
  prompt: |
    You receive a JSON tally of customer reviews: the team it is for, the counts
    per sentiment, the problems reported in the negative ones with their product
    and whether a reply was drafted, and the products with the most complaints.
    Write a note of at most five sentences addressed to that team: what is going
    well, which problems come back, which product needs attention first, and how
    many unhappy customers are still waiting for a reply.

context:
  inject: false

output:
  schema:
    type: object
    properties:
      note: { type: string }
      attention: { type: string, description: "the product to look at first" }
    required: [note, attention]

observability:
  tracing: false
